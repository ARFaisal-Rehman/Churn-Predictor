<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Risk Radar — Customer Churn Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Monoton&family=Roboto:wght@300;400;700&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <i class="fas fa-broadcast-tower"></i>
                <h1>Risk Radar</h1>
            </div>
            <p class="tagline">Customer Churn Dashboard</p>
        </header>

        <main class="landing-page">
            <div class="upload-section">
                <h2>Upload Customer Data</h2>
                <p>Drag and drop your CSV or Excel file to predict customer churn risk</p>
                
                <div class="upload-area" id="dropArea">
                    <i class="fas fa-cloud-upload-alt"></i>
                    <p>Drag & Drop Files Here</p>
                    <p>or</p>
                    <label for="fileInput" class="btn">Browse Files</label>
                    <input type="file" id="fileInput" accept=".csv,.xlsx,.xls" hidden>
                </div>
                
                <div class="file-info" id="fileInfo" style="display: none;">
                    <p><span id="fileName"></span> (<span id="fileSize"></span>)</p>
                    <button class="btn" id="uploadBtn">Upload & Analyze</button>
                </div>
            </div>

            <div class="preview-section" id="previewSection" style="display: none;">
                <h2>Data Preview</h2>
                <div class="preview-info">
                    <p><strong>Rows:</strong> <span id="rowCount">0</span></p>
                    <p><strong>Columns:</strong> <span id="columnCount">0</span></p>
                </div>
                
                <div class="table-container">
                    <table id="previewTable">
                        <thead>
                            <tr id="tableHeader"></tr>
                        </thead>
                        <tbody id="tableBody"></tbody>
                    </table>
                </div>
                
                <div class="validation-message" id="validationMessage"></div>
                
                <div class="action-buttons">
                    <button class="btn btn-secondary" id="cancelBtn">Cancel</button>
                    <button class="btn" id="predictBtn">Generate Predictions</button>
                </div>
            </div>

            <div class="loading-section" id="loadingSection" style="display: none;">
                <div class="loader"></div>
                <p>Analyzing customer data and generating predictions...</p>
            </div>
        </main>

        <footer>
            <p>&copy; 2023 Risk Radar. All rights reserved.</p>
        </footer>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
